<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Joke Generator</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  background: white;
  border-radius: 15px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  padding: 40px;
  max-width: 600px;
  width: 100%;
  text-align: center;
}

h1 {
  color: #333;
  margin-bottom: 10px;
  font-size: 2.5em;
}

.subtitle {
  color: #666;
  margin-bottom: 30px;
  font-size: 1.1em;
}

.joke-box {
  background: #f7f7f7;
  border-left: 4px solid #667eea;
  border-radius: 8px;
  padding: 25px;
  margin: 30px 0;
  min-height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.joke-text {
  font-size: 1.3em;
  color: #333;
  line-height: 1.6;
  font-weight: 500;
}

.joke-type {
  color: #999;
  font-size: 0.9em;
  margin-top: 10px;
}

.buttons {
  display: flex;
  gap: 15px;
  margin-top: 30px;
  flex-wrap: wrap;
  justify-content: center;
}

button {
  flex: 1;
  min-width: 150px;
  padding: 14px 28px;
  border: none;
  border-radius: 8px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
}

.btn-primary {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}

.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: #e8e8e8;
  color: #333;
}

.btn-secondary:hover {
  background: #d8d8d8;
  transform: translateY(-2px);
}

.loading {
  display: none;
  text-align: center;
}

.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid #667eea;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.error {
  background: #fee;
  color: #c33;
  padding: 15px;
  border-radius: 8px;
  margin: 15px 0;
}

.category-select {
  width: 100%;
  padding: 10px;
  margin: 20px 0;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  font-size: 1em;
  cursor: pointer;
}

.category-select:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}
</style>
</head>
<body>
<div class="container">
  <h1>😂 Joke Generator</h1>
  <p class="subtitle">Get a random laugh!</p>
  
  <select class="category-select" id="categorySelect">
    <option value="random">Random Joke (Any Category)</option>
    <option value="programming">Programming</option>
    <option value="knock-knock">Knock-Knock</option>
    <option value="general">General</option>
  </select>
  
  <div class="joke-box">
    <div id="jokeContent">
      <div class="joke-text">Click "Get Joke" to start laughing! 🎉</div>
    </div>
  </div>
  
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Getting a joke for you...</p>
  </div>
  
  <div id="error" class="error" style="display: none;"></div>
  
  <div class="buttons">
    <button class="btn-primary" onclick="getJoke()">Get Joke</button>
    <button class="btn-secondary" onclick="copyJoke()">Copy Joke</button>
  </div>
</div>

<script>
let currentJoke = '';

async function getJoke() {
  const category = document.getElementById('categorySelect').value;
  const loading = document.getElementById('loading');
  const jokeContent = document.getElementById('jokeContent');
  const errorDiv = document.getElementById('error');
  
  loading.style.display = 'block';
  errorDiv.style.display = 'none';
  jokeContent.style.display = 'none';
  
  try {
    let url = 'https://official-joke-api.appspot.com/random_joke';
    
    if (category === 'programming') {
      url = 'https://official-joke-api.appspot.com/jokes/programming/random';
    } else if (category === 'knock-knock') {
      url = 'https://official-joke-api.appspot.com/jokes/knock-knock/random';
    } else if (category === 'general') {
      url = 'https://official-joke-api.appspot.com/jokes/general/random';
    }
    
    const response = await fetch(url);
    
    if (!response.ok) {
      throw new Error('Failed to fetch joke');
    }
    
    const data = await response.json();
    
    // Handle both single joke and array of jokes
    const joke = Array.isArray(data) ? data[0] : data;
    
    let jokeText = '';
    
    if (joke.type === 'knock-knock') {
      jokeText = `<strong>${joke.setup}</strong><br><br>${joke.punchline}`;
    } else {
      jokeText = `<strong>${joke.setup}</strong><br><br>${joke.punchline}`;
    }
    
    currentJoke = `${joke.setup}\n${joke.punchline}`;
    
    jokeContent.innerHTML = `
      <div class="joke-text">${jokeText}</div>
      <div class="joke-type">Type: ${joke.type}</div>
    `;
    
    loading.style.display = 'none';
    jokeContent.style.display = 'block';
    
  } catch (error) {
    loading.style.display = 'none';
    errorDiv.style.display = 'block';
    errorDiv.innerHTML = `<strong>Oops!</strong> ${error.message}. Please try again.`;
  }
}

function copyJoke() {
  if (currentJoke) {
    navigator.clipboard.writeText(currentJoke).then(() => {
      alert('Joke copied to clipboard! 📋');
    }).catch(() => {
      alert('Failed to copy joke');
    });
  } else {
    alert('No joke to copy. Get a joke first!');
  }
}

// Get a joke when the page loads
window.addEventListener('load', getJoke);

// Allow Enter key to get new joke
document.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    getJoke();
  }
});
</script>
</body>
</html>
